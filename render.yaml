services:
  - type: web
    name: multi-currency-wallet-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multi-currency-wallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EXCHANGE_REFRESH_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://multi-currency-wallet-web.onrender.com
      - key: SUPPORTED_CURRENCIES
        value: USD,EUR,GBP,INR,JPY

  - type: web
    name: multi-currency-wallet-web
    runtime: docker
    rootDir: frontend
    plan: starter
    dockerBuildArgs:
      VITE_API_BASE_URL: https://multi-currency-wallet-api.onrender.com
    healthCheckPath: /health

databases:
  - name: multi-currency-wallet-db
    plan: starter
